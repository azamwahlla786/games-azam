<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>VIP RACER 3D</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{--c1:#00e5ff;--c2:#ff3da6;--ui:#fff;--glass:rgba(8,10,28,.62);box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;margin:0;background:#050818;color:var(--ui);font:600 14px "Segoe UI",system-ui,sans-serif;overflow:hidden;touch-action:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0);display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none;z-index:2}
.box{background:var(--glass);border:1px solid #ffffff22;border-radius:14px;padding:8px 14px;backdrop-filter:blur(10px)}
.big{font-size:34px;font-weight:800;line-height:1;text-shadow:0 0 14px var(--c1)}.sm{font-size:11px;letter-spacing:2px;opacity:.7}
.bar{height:8px;width:150px;background:#ffffff22;border-radius:5px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--c1),var(--c2));transition:width .1s}
.ov{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:radial-gradient(circle,#0a0f3066,#050818dd);text-align:center;padding:20px}
.ov.hide{display:none}
h1{margin:0;font-size:min(13vw,72px);letter-spacing:.12em;background:linear-gradient(90deg,var(--c1),#8b5cf6,var(--c2),var(--c1));background-size:300%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sh 5s linear infinite;filter:drop-shadow(0 0 18px #8b5cf6)}
@keyframes sh{to{background-position:300%}}
.btn{background:linear-gradient(135deg,var(--c1),#8b5cf6);color:#fff;border:0;border-radius:30px;padding:14px 38px;font:800 18px inherit;font-family:inherit;letter-spacing:2px;cursor:pointer;box-shadow:0 0 26px #00e5ff77;animation:pu 2s infinite}
@keyframes pu{50%{transform:scale(1.06);box-shadow:0 0 40px #8b5cf6aa}}
.cars{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}.cc{width:92px;padding:10px 6px;border-radius:14px;background:var(--glass);border:2px solid #ffffff22;cursor:pointer;transition:.2s}.cc.on{border-color:var(--c1);box-shadow:0 0 18px #00e5ff77;transform:translateY(-4px)}
.dot{width:34px;height:18px;border-radius:6px;margin:0 auto 6px}
.tc{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0));z-index:3;display:none;gap:12px}
.tc button{width:76px;height:76px;border-radius:50%;border:2px solid #ffffff55;background:var(--glass);color:#fff;font-size:30px}
@media (pointer:coarse){.tc{display:flex}}
#toast{position:fixed;top:30%;left:50%;transform:translateX(-50%);font-size:30px;font-weight:800;color:var(--c1);text-shadow:0 0 18px var(--c1);opacity:0;z-index:4;pointer-events:none;transition:.3s}
</style></head><body>
<canvas id="c"></canvas>
<div class="hud"><div class="box"><div class="sm">SCORE</div><div class="big" id="sc">0</div><div class="sm" id="co" style="margin-top:6px">🪙 0 &nbsp; BEST 0</div></div>
<div class="box" style="text-align:right"><div class="sm">KM/H</div><div class="big" id="sp">0</div><div class="bar"><i id="nb"></i></div><div class="sm">NITRO</div></div></div>
<div id="toast"></div>
<div class="tc" style="left:14px"><button id="bl">◀</button><button id="br">▶</button></div>
<div class="tc" style="right:14px"><button id="bn" style="background:linear-gradient(135deg,#00e5ff88,#8b5cf688)">⚡</button></div>
<div class="ov" id="menu"><h1>VIP RACER</h1><div class="sm">3D HIGHWAY • TRAFFIC • NITRO</div>
<div class="cars" id="cars"></div>
<button class="btn" id="go">START ENGINE</button>
<div class="sm" style="max-width:420px;line-height:1.8">← → / A D steer &nbsp;•&nbsp; SHIFT / SPACE nitro &nbsp;•&nbsp; N night mode<br>Traffic se bacho, coins uthao, nitro se speed barhao</div></div>
<div class="ov hide" id="over"><h1 style="font-size:min(10vw,54px)">CRASHED!</h1><div class="big" id="fs">0</div><div class="sm" id="fb"></div><button class="btn" id="again">RACE AGAIN</button></div>
<script>
const T=THREE,$=i=>document.getElementById(i);
let LS=null;try{LS=localStorage}catch(e){}
const gv=k=>{try{return +(LS&&LS.getItem(k))||0}catch(e){return 0}},sv=(k,v)=>{try{LS&&LS.setItem(k,v)}catch(e){}};
const R=new T.WebGLRenderer({canvas:$('c'),antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
const sc=new T.Scene(),cam=new T.PerspectiveCamera(65,1,.1,600);
const hemi=new T.HemisphereLight(0xcfe8ff,0x3a5a2a,.9),sun=new T.DirectionalLight(0xffffff,.9);sun.position.set(30,60,20);sun.castShadow=true;sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=40;sun.shadow.camera.bottom=-40;sun.shadow.mapSize.set(1024,1024);
sc.add(hemi,sun,sun.target);
const head=new T.SpotLight(0xfff2cc,0,90,.5,.5);sc.add(head,head.target);
function rs(){R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}rs();addEventListener('resize',rs);
const M=(c,o={})=>new T.MeshStandardMaterial({color:c,roughness:.5,metalness:.3,...o});
const COLORS=[['Red Sport',0xe11d2e],['Blue Turbo',0x1d6bff],['Gold VIP',0xffc233],['Black Ghost',0x15171c]];
function makeCar(col,truck){const g=new T.Group(),L=truck?7:4.2,body=new T.Mesh(new T.BoxGeometry(2,truck?2.4:.65,L),M(col,{metalness:.7,roughness:.25}));body.position.y=truck?1.7:.65;body.castShadow=true;g.add(body);
if(!truck){const cab=new T.Mesh(new T.BoxGeometry(1.7,.55,2.1),M(0x0b1320,{metalness:.9,roughness:.1}));cab.position.set(0,1.22,.25);g.add(cab);const sp=new T.Mesh(new T.BoxGeometry(2.1,.1,.5),M(0x111111));sp.position.set(0,1.2,L/2-.1);g.add(sp)}
const wg=new T.CylinderGeometry(.42,.42,.35,16),wm=M(0x111111,{metalness:0,roughness:.9});
for(const [x,z] of [[-1,-L/2+.9],[1,-L/2+.9],[-1,L/2-.9],[1,L/2-.9]]){const w=new T.Mesh(wg,wm);w.rotation.z=Math.PI/2;w.position.set(x,.42,z);g.add(w)}
const hl=M(0xffffee,{emissive:0xffffaa,emissiveIntensity:1}),tl=M(0xff0000,{emissive:0xff0000,emissiveIntensity:1.2});
for(const x of [-.7,.7]){const a=new T.Mesh(new T.BoxGeometry(.4,.2,.1),hl);a.position.set(x,.75,-L/2);g.add(a);const b=new T.Mesh(new T.BoxGeometry(.4,.2,.1),tl);b.position.set(x,.75,L/2);g.add(b)}
g.userData.L=L;return g}
let car,sel=0,state='menu',night=false;
function setCar(){if(car)sc.remove(car);car=makeCar(COLORS[sel][1]);car.userData.fl=[-.6,.6].map(x=>{const f=new T.Mesh(new T.ConeGeometry(.22,2,8),new T.MeshBasicMaterial({color:0x00e5ff,transparent:true,opacity:.85}));f.rotation.x=-Math.PI/2;f.position.set(x,.6,3.3);f.visible=false;car.add(f);return f});sc.add(car)}
$('cars').innerHTML=COLORS.map((c,i)=>'<div class="cc" data-i="'+i+'"><div class="dot" style="background:#'+c[1].toString(16).padStart(6,'0')+';box-shadow:0 0 12px #'+c[1].toString(16).padStart(6,'0')+'"></div>'+c[0]+'</div>').join('');
$('cars').onclick=e=>{const d=e.target.closest('.cc');if(!d)return;sel=+d.dataset.i;setCar();mark()};
function mark(){document.querySelectorAll('.cc').forEach((d,i)=>d.classList.toggle('on',i==sel))}
/* world */
const TL=80,TN=7,tiles=[],roadM=M(0x23262d,{roughness:.9,metalness:0}),grass=M(0x2f7d32,{roughness:1,metalness:0}),lineM=new T.MeshBasicMaterial({color:0xffffff}),dashG=new T.BoxGeometry(.2,.02,4);
const bm=[0x394867,0x5b6b8c,0x7a5c4e,0x4b5563,0x2c3a54].map(c=>M(c,{roughness:.8,metalness:.1,emissive:0x000000}));
const trees=[];
function tile(i){const g=new T.Group(),r=new T.Mesh(new T.PlaneGeometry(14,TL),roadM);r.rotation.x=-Math.PI/2;r.receiveShadow=true;g.add(r);
for(const s of [-1,1]){const gr=new T.Mesh(new T.PlaneGeometry(120,TL),grass);gr.rotation.x=-Math.PI/2;gr.position.set(s*67,-.02,0);gr.receiveShadow=true;g.add(gr);
const e=new T.Mesh(new T.BoxGeometry(.25,.02,TL),lineM);e.position.set(s*6.6,.02,0);g.add(e);
for(let k=0;k<5;k++){const h=8+Math.random()*34,w=6+Math.random()*7,b=new T.Mesh(new T.BoxGeometry(w,h,w),bm[Math.random()*bm.length|0].clone());b.position.set(s*(14+w/2+Math.random()*30),h/2,-TL/2+k*(TL/5)+Math.random()*8);b.userData.b=1;g.add(b)}
for(let k=0;k<4;k++){const t=new T.Group(),tr=new T.Mesh(new T.CylinderGeometry(.2,.3,2),M(0x5a3b1e,{metalness:0}));tr.position.y=1;const lf=new T.Mesh(new T.ConeGeometry(1.4,3.4,8),M(0x1d6b2a,{metalness:0}));lf.position.y=3.5;t.add(tr,lf);t.position.set(s*(8.5+Math.random()*3),0,-TL/2+k*20+Math.random()*6);g.add(t)}}
for(const x of [-2.2,2.2])for(let k=0;k<8;k++){const d=new T.Mesh(dashG,lineM);d.position.set(x,.02,-TL/2+k*10+2);g.add(d)}
g.position.z=TL-i*TL;sc.add(g);return g}
for(let i=0;i<TN;i++)tiles.push(tile(i));
const stars=new T.Points(new T.BufferGeometry().setAttribute('position',new T.Float32BufferAttribute(Array.from({length:600},(_,i)=>i%3==1?60+Math.random()*200:(Math.random()-.5)*600),3)),new T.PointsMaterial({color:0xffffff,size:1.4,fog:false}));stars.visible=false;sc.add(stars);
function setTime(n){night=n;const bg=n?0x050818:0x8fd0ff;sc.background=new T.Color(bg);sc.fog=new T.Fog(bg,60,n?260:380);hemi.intensity=n?.25:.9;sun.intensity=n?.1:.9;head.intensity=n?2.2:0;stars.visible=n;
tiles.forEach(t=>t.children.forEach(o=>{if(o.userData.b){o.material.emissive.setHex(n?0x3a3320:0);}}))}
/* game */
let sp=0,x=0,steer=0,nitro=100,nit=false,score=0,coins=0,best=gv('vr_best'),traffic=[],cn=[],spawnT=0,coinT=0,shake=0,tmAudio=null,ac=null,osc=null,gain=null,over=false;
const keys={};addEventListener('keydown',e=>{keys[e.code]=1;if(e.code==='KeyN')setTime(!night)});addEventListener('keyup',e=>keys[e.code]=0);
for(const [id,k] of [['bl','ArrowLeft'],['br','ArrowRight'],['bn','Space']]){const b=$(id);['pointerdown'].forEach(v=>b.addEventListener(v,e=>{e.preventDefault();keys[k]=1}));['pointerup','pointerleave','pointercancel'].forEach(v=>b.addEventListener(v,()=>keys[k]=0))}
function toast(t){const e=$('toast');e.textContent=t;e.style.opacity=1;e.style.transform='translateX(-50%) scale(1.15)';setTimeout(()=>{e.style.opacity=0;e.style.transform='translateX(-50%) scale(1)'},700)}
function aud(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();osc=ac.createOscillator();gain=ac.createGain();osc.type='sawtooth';gain.gain.value=.04;osc.connect(gain).connect(ac.destination);osc.start()}catch(e){}}
function crashSnd(){try{const b=ac.createBuffer(1,ac.sampleRate*.5,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=ac.createBufferSource(),g=ac.createGain();g.gain.value=.5;s.buffer=b;s.connect(g).connect(ac.destination);s.start()}catch(e){}}
function reset(){traffic.forEach(t=>sc.remove(t));cn.forEach(t=>sc.remove(t));traffic=[];cn=[];sp=0;x=0;nitro=100;score=0;coins=0;over=false;car.position.set(0,0,0);car.rotation.set(0,0,0)}
function start(){reset();state='play';$('menu').classList.add('hide');$('over').classList.add('hide');if(!osc)aud();if(ac&&ac.state==='suspended')ac.resume()}
$('go').onclick=start;$('again').onclick=start;
const LANES=[-4.4,0,4.4],tcol=[0xf5f5f5,0x2b6cb0,0x2f855a,0xd69e2e,0x6b46c1,0xdd6b20];
function spawn(){const l=Math.random()*3|0,tr=Math.random()<.2;if(traffic.some(t=>t.userData.l===l&&t.position.z<-250&&t.position.z>-340))return;const c=makeCar(tcol[Math.random()*tcol.length|0],tr);c.userData.l=l;c.userData.v=18+Math.random()*20;c.position.set(LANES[l],0,-320);sc.add(c);traffic.push(c)}
const cg=new T.CylinderGeometry(.6,.6,.12,16),cm=new T.MeshStandardMaterial({color:0xffd23f,emissive:0xffa000,emissiveIntensity:.7,metalness:.8,roughness:.2});
function spawnCoins(){const l=Math.random()*3|0;for(let k=0;k<6;k++){const m=new T.Mesh(cg,cm);m.rotation.x=Math.PI/2;m.position.set(LANES[l],1,-300-k*7);sc.add(m);cn.push(m)}}
function die(){state='over';over=true;shake=1.2;crashSnd();if(gain)gain.gain.value=0;const s=score|0;if(s>best){best=s;sv('vr_best',best)}$('fs').textContent=s+' pts';$('fb').textContent='BEST '+best+'  •  COINS '+coins;setTimeout(()=>$('over').classList.remove('hide'),700)}
let last=performance.now();
function frame(now){requestAnimationFrame(frame);const dt=Math.min(.05,(now-last)/1000);last=now;
if(state==='play'){const l=keys.ArrowLeft||keys.KeyA,r=keys.ArrowRight||keys.KeyD,wantN=keys.Space||keys.ShiftLeft||keys.ShiftRight;
steer+=((r?1:0)-(l?1:0)-steer)*Math.min(1,dt*9);x=Math.max(-5.3,Math.min(5.3,x+steer*dt*(8+sp*.12)));
nit=!!wantN&&nitro>0;nitro=nit?Math.max(0,nitro-dt*28):Math.min(100,nitro+dt*6);
const mx=nit?115:72;sp+=((mx-sp)*(nit?1.4:.35))*dt;
score+=sp*dt*.12;spawnT-=dt;coinT-=dt;if(spawnT<=0){spawn();spawnT=Math.max(.45,1.5-sp/110)*(.6+Math.random()*.8)}if(coinT<=0){spawnCoins();coinT=5+Math.random()*5}
car.position.x=x;car.rotation.y=-steer*.22;car.rotation.z=-steer*.06;car.userData.fl.forEach(f=>{f.visible=nit;f.scale.y=.8+Math.random()*.6});
for(let i=traffic.length-1;i>=0;i--){const t=traffic[i];t.position.z+=(sp-t.userData.v)*dt;
if(Math.abs(t.position.x-x)<1.9&&Math.abs(t.position.z)<(t.userData.L+4.2)/2-.2){die();break}
if(t.position.z>40||t.position.z<-400){sc.remove(t);traffic.splice(i,1)}}
for(let i=cn.length-1;i>=0;i--){const m=cn[i];m.position.z+=sp*dt;m.rotation.z+=dt*4;if(Math.abs(m.position.x-x)<1.5&&Math.abs(m.position.z)<2){coins++;score+=50;sc.remove(m);cn.splice(i,1);if(coins%10==0)toast('+10 COINS! 🪙');continue}if(m.position.z>20){sc.remove(m);cn.splice(i,1)}}
if(osc)osc.frequency.value=50+sp*2.6+(nit?40:0)}
else if(state==='menu'){sp=25;car.rotation.y+=dt*.8}
else if(state==='over'){sp*=Math.pow(.05,dt)}
tiles.forEach(t=>{t.position.z+=sp*dt;if(t.position.z>TL*1.5)t.position.z-=TL*TN});
const tgt=state==='menu'?new T.Vector3(Math.sin(now/1500)*3.5,1.8,6.5):new T.Vector3(x*.6,4.3+(nit?-.5:0),9.5+(nit?1.5:0));
cam.position.lerp(tgt,Math.min(1,dt*6));if(shake>0){cam.position.x+=(Math.random()-.5)*shake;cam.position.y+=(Math.random()-.5)*shake;shake-=dt*2}
else if(nit){cam.position.x+=(Math.random()-.5)*.08}
cam.fov+=((nit?82:65+sp*.06)-cam.fov)*Math.min(1,dt*5);cam.updateProjectionMatrix();cam.lookAt(state==='menu'?0:x*.7,1.2,state==='menu'?0:-12);
sun.position.set(x+30,60,car.position.z+20);sun.target.position.set(x,0,0);head.position.set(x,1.4,-1);head.target.position.set(x,0,-40);
$('sc').textContent=score|0;$('sp').textContent=Math.round(sp*3.1);$('co').innerHTML='🪙 '+coins+' &nbsp; BEST '+Math.max(best,score|0);$('nb').style.width=nitro+'%';
R.render(sc,cam)}
setTime(false);setCar();mark();requestAnimationFrame(frame);
</script></body></html>
